<!doctype html>
<html lang="en">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reader (md + txt)</title>

<!-- Marked.js for Markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 0; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px 48px; }
  select, button, input { font: inherit; }
  #content { padding: 16px; border: 1px solid #eee; border-radius: 10px; background: #fafafa; overflow-x: auto; }
  .muted { color: #666; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>

<body>
  <header>
    <strong>Open:</strong>
    <select id="fileSelect"></select>
    <button id="openBtn">Load</button>
    <span class="muted">Tip: also try <code>?file=my-notes.md</code> in the URL</span>
  </header>

  <main>
    <div id="status" class="muted">Choose a file to load…</div>
    <div id="content"></div>
  </main>

<script>
/**
 * 1) List your files here (same folder as index.html)
 *    Examples: "readme.md", "notes.txt", "guide.md"
 */
const files = [
"MyFamilyTree.md"
  "readme1.md",
  "notes.txt"
];

/**
 * Utilities
 */
const q = new URLSearchParams(location.search);
const fileParam = q.get("file");

const fileSelect = document.getElementById("fileSelect");
const openBtn = document.getElementById("openBtn");
const statusEl = document.getElementById("status");
const contentEl = document.getElementById("content");

// Populate dropdown
files.forEach(f => {
  const opt = document.createElement("option");
  opt.value = f;
  opt.textContent = f;
  fileSelect.appendChild(opt);
});

// If URL has ?file=..., select it; otherwise select the first
if (fileParam && files.includes(fileParam)) {
  fileSelect.value = fileParam;
} else if (files.length) {
  fileSelect.value = files[0];
}

/**
 * Fetch and render a file from the same directory as index.html
 */
async function loadFile(filename) {
  statusEl.textContent = `Loading “${filename}”…`;
  contentEl.innerHTML = "";

  // Basic safety: prevent directory traversal
  if (filename.includes("..") || filename.startsWith("/")) {
    statusEl.textContent = "Blocked invalid path.";
    return;
  }

  try {
    const res = await fetch("./" + encodeURIComponent(filename));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();

    // Render based on extension
    if (filename.toLowerCase().endsWith(".md")) {
      // Markdown → HTML
      contentEl.innerHTML = marked.parse(text);
    } else {
      // Plain text → wrap in <pre>
      const pre = document.createElement("pre");
      pre.textContent = text;
      contentEl.replaceChildren(pre);
    }

    statusEl.textContent = `Loaded “${filename}”.`;
    // Update query so you can bookmark/share the current file
    const url = new URL(location.href);
    url.searchParams.set("file", filename);
    history.replaceState(null, "", url);
  } catch (err) {
    statusEl.textContent = `Error loading “${filename}”: ${err.message}`;
  }
}

// Wire up UI
openBtn.addEventListener("click", () => loadFile(fileSelect.value));
fileSelect.addEventListener("change", () => loadFile(fileSelect.value));

// Auto-load on first visit if we have a selection
if (fileSelect.value) loadFile(fileSelect.value);
</script>
</body>
</html>

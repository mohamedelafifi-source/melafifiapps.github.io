<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MElAfifi Document Retrieval</title>

<!-- Markdown renderer -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  :root { --gap: 14px; --maxw: 900px; }
  html, body { margin:0; font:16px/1.55 -apple-system, system-ui, Segoe UI, Roboto, sans-serif; }
  header { padding: 18px 16px; border-bottom: 1px solid #eee; }
  h1 { font-size: 20px; margin: 0 0 10px 0; }
  .controls { display:flex; gap: var(--gap); align-items:center; flex-wrap:wrap; }
  select, button { font: inherit; padding: 8px 10px; }
  main { max-width: var(--maxw); margin: 22px auto 56px; padding: 0 16px; }
  #status { color:#666; margin-bottom: 10px; }
  #content { border:1px solid #eee; border-radius:12px; padding:16px; background:#fafafa; overflow-x:auto; }
  pre { white-space: pre-wrap; word-wrap: break-word; }
</style>

<body>
  <header>
    <h1>MElAfifi Document Retrieval</h1>
    <div class="controls">
      <label for="fileSelect"><strong>Open:</strong></label>
      <select id="fileSelect"></select>
      <button id="openBtn">Load</button>
    </div>
  </header>

  <main>
    <div id="status">Choose a file and click Load…</div>
    <div id="content"></div>
  </main>

<script>
/* ====== Hard-coded files (same folder as index.html) ====== */
const files = [
  "GeneralInfo.md",
  "MyFamilyTree.md",
  "Privacy.txt"
];

/* ====== Elements ====== */
const fileSelect = document.getElementById("fileSelect");
const openBtn    = document.getElementById("openBtn");
const statusEl   = document.getElementById("status");
const contentEl  = document.getElementById("content");

/* ====== Populate dropdown ====== */
files.forEach(name => {
  const opt = document.createElement("option");
  opt.value = name;
  opt.textContent = name;
  fileSelect.appendChild(opt);
});

/* ====== Loader ====== */
async function loadFile(filename) {
  statusEl.textContent = `Loading “${filename}”…`;
  contentEl.innerHTML = "";

  // basic safety
  if (!filename || filename.includes("..") || filename.startsWith("/")) {
    statusEl.textContent = "Invalid filename.";
    return;
  }

  try {
    const res = await fetch("./" + encodeURIComponent(filename));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();

    if (filename.toLowerCase().endsWith(".md")) {
      contentEl.innerHTML = marked.parse(text);
    } else {
      const pre = document.createElement("pre");
      pre.textContent = text;
      contentEl.replaceChildren(pre);
    }

    statusEl.textContent = `Loaded “${filename}”.`;
  } catch (err) {
    statusEl.textContent = `Error loading “${filename}”: ${err.message}`;
  }
}

/* ====== Events ====== */
openBtn.addEventListener("click", () => {
  const f = fileSelect.value;
  if (f) loadFile(f);
});

/* ====== Auto-select & load first file ====== */
if (files.length) {
  fileSelect.value = files[0];
  loadFile(files[0]);
} else {
  statusEl.textContent = "No files configured.";
}
</script>
</body>
</html>
